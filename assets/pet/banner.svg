<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="bannerTitle bannerDesc"><title id="bannerTitle">Skillary Agents</title><desc id="bannerDesc">A protocol for a crew of coding agents, with Skillary's pixel companion working at a laptop.</desc><rect width="1200" height="400" rx="24" fill="#131417"/><path d="M64 326H1136" stroke="#41444b"/><g font-family="Arial, sans-serif"><text x="64" y="91" fill="#cda03a" font-size="15" font-weight="700" letter-spacing="3">SKILLARY / AGENTS</text><text x="60" y="164" fill="#f7f7f5" font-size="54" font-weight="700" letter-spacing="-2">A crew for the work ahead.</text><text x="64" y="218" fill="#b7bcc3" font-size="22">Scout. Plan. Build. Check.</text><text x="64" y="278" fill="#cda03a" font-size="15">6 roles</text><text x="159" y="278" fill="#b7bcc3" font-size="15">8 playbooks</text><text x="290" y="278" fill="#b7bcc3" font-size="15">Your agent's tools</text></g><svg x="790" y="50" width="350" height="290" viewBox="140 65 360 290"><title id="title">Skillary pixel companion</title><desc id="desc">Skillary's original platinum and champagne-gold pixel companion. Still image of the companion working on a laptop.</desc><style>.walk{animation:travel 12s infinite}.body{animation:bob 12s infinite}.legA{transform-origin:-24px 60px;animation:leg 12s infinite}.legB{transform-origin:24px 60px;animation:legOther 12s infinite}.armA{transform-origin:-52px 12px;animation:arm 12s infinite}.armB{transform-origin:52px 12px;animation:armOther 12s infinite}.eyes{transform-origin:0 -35px;animation:blink 5s infinite}.laptop{animation:laptop 12s infinite}.thought{opacity:0;animation:thought 12s infinite}.done{opacity:0;animation:done 12s infinite}
@keyframes travel{0%,4%{transform:translateX(-105px);opacity:1}7%{opacity:1}35%,92%{transform:translateX(0);opacity:1}98%,100%{opacity:0}}
@keyframes bob{0%,6%,12%,18%,24%,30%,36%,100%{transform:translateY(0)}9%,15%,21%,27%,33%{transform:translateY(-7px)}}
@keyframes leg{0%,6%,12%,18%,24%,30%{transform:rotate(-18deg)}3%,9%,15%,21%,27%,33%{transform:rotate(18deg)}36%,100%{transform:rotate(0)}}
@keyframes arm{0%,6%,12%,18%,24%,30%{transform:rotate(16deg)}3%,9%,15%,21%,27%,33%{transform:rotate(-16deg)}36%,50%,94%,100%{transform:rotate(0)}56%,62%,68%,74%,80%,86%{transform:rotate(-14deg)}59%,65%,71%,77%,83%,89%{transform:rotate(-4deg)}}
@keyframes blink{0%,43%,48%,90%,95%,100%{transform:scaleY(1)}45%,93%{transform:scaleY(.1)}}
@keyframes laptop{0%,47%,100%{opacity:0;transform:translateY(16px)}54%,92%{opacity:1;transform:translateY(0)}98%{opacity:0}}
@keyframes thought{0%,35%,54%,100%{opacity:0}40%,48%{opacity:1}}
@keyframes done{0%,82%,96%,100%{opacity:0}87%,92%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.walk,.laptop{opacity:1;transform:none}.thought,.done{opacity:0}}@keyframes legOther{0%,6%,12%,18%,24%,30%{transform:rotate(18deg)}3%,9%,15%,21%,27%,33%{transform:rotate(-18deg)}36%,100%{transform:rotate(0)}}@keyframes armOther{0%,6%,12%,18%,24%,30%{transform:rotate(-16deg)}3%,9%,15%,21%,27%,33%{transform:rotate(16deg)}36%,50%,94%,100%{transform:rotate(0)}56%,62%,68%,74%,80%,86%{transform:rotate(4deg)}59%,65%,71%,77%,83%,89%{transform:rotate(14deg)}}.walk{animation:none;opacity:1;transform:none}.body{animation:none}.legA,.legB,.armA,.armB{animation:none;transform:none}.thought,.done,.laptop{animation:none;opacity:0;transform:none}.eyes{animation:blink 5s infinite}.eyes{animation:none}.laptop{opacity:1}</style><g transform="translate(320 220)"><g class="walk"><ellipse cy="110" rx="82" ry="9" fill="#08090b"/><g shape-rendering="crispEdges"><g class="legA"><path d="M-40 56h24v36h-32v16h-16V84h24Z" fill="#cda03a"/></g><g class="legB"><path d="M16 56h24v28h24v24H32V92H16Z" fill="#cda03a"/></g><g class="body"><path d="M-64-72h16v-32h16v16h16v16H32v-16h16v-16h16v32h16v104H64v32H-48V48H-64Z" fill="#f7f7f5"/><path d="M64-56h16v88H64v32H-48V48H48V32h16Z" fill="#a0a5ae"/><path d="M-48-56h96v56h-96Z" fill="#131417"/><g class="eyes" fill="#cda03a"><path d="M-32-40h16v24h-16Z M16-40h16v24H16Z"/></g><path d="M-8-8H8V0H-8Z" fill="#cda03a"/><path d="M-16 20h32v8h-32Z" fill="#cda03a"/><g class="armA"><path d="M-64 0h-16v40h16v8h16V24h-16Z" fill="#f7f7f5"/></g><g class="armB"><path d="M64 0h16v40H64v8H48V24h16Z" fill="#f7f7f5"/></g></g></g><g class="laptop"><path d="M-63 32H63L53 94H-53Z" fill="#23262c" stroke="#747981" stroke-width="2"/><path d="M-59 35H59" stroke="#f7f7f5" stroke-opacity=".25"/><path d="M-71 95H71L60 102H-60Z" fill="#9ba0a8"/><path d="m-10 62 10-6 10 6v12L0 80-10 74Z" fill="none" stroke="#cda03a" stroke-width="2"/><path d="M-8 97H8" stroke="#131417" stroke-width="2"/></g><g class="thought" fill="#cda03a"><circle cx="78" cy="-78" r="3"/><circle cx="89" cy="-92" r="5"/><path d="M108-131a14 14 0 0 1 9 25v8h-18v-8a14 14 0 0 1 9-25Z" fill="none" stroke="#cda03a" stroke-width="3"/><path d="M102-92h12M108-142v-5M85-128l-5-3M130-128l5-3" stroke="#cda03a" stroke-width="3" stroke-linecap="round"/></g><g class="done"><circle cx="84" cy="-95" r="15" fill="#cda03a"/><path d="m77-95 5 5 9-10" fill="none" stroke="#131417" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg></svg>