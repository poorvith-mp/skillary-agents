<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Skillary pet concept: Geometric character</title><desc id="desc">An original geometric character walks into view, thinks, then types on a laptop and completes a task. Twelve-second repeating animation. Reduced motion shows the character working at rest.</desc><defs><linearGradient id="shell" x1="0" x2=".9" y2="1"><stop stop-color="#f7f7f5"/><stop offset="1" stop-color="#9ea4ac"/></linearGradient><radialGradient id="halo"><stop stop-color="#cda03a" stop-opacity=".09"/><stop offset="1" stop-color="#131417" stop-opacity="0"/></radialGradient></defs><style>.walk{animation:travel 12s infinite}.body{animation:bob 12s infinite}.legA{transform-origin:-24px 60px;animation:leg 12s infinite}.legB{transform-origin:24px 60px;animation:legOther 12s infinite}.armA{transform-origin:-52px 12px;animation:arm 12s infinite}.armB{transform-origin:52px 12px;animation:armOther 12s infinite}.eyes{transform-origin:0 -35px;animation:blink 5s infinite}.laptop{animation:laptop 12s infinite}.thought{opacity:0;animation:thought 12s infinite}.done{opacity:0;animation:done 12s infinite}
@keyframes travel{0%,4%{transform:translateX(-105px);opacity:1}7%{opacity:1}35%,92%{transform:translateX(0);opacity:1}98%,100%{opacity:0}}
@keyframes bob{0%,6%,12%,18%,24%,30%,36%,100%{transform:translateY(0)}9%,15%,21%,27%,33%{transform:translateY(-7px)}}
@keyframes leg{0%,6%,12%,18%,24%,30%{transform:rotate(-18deg)}3%,9%,15%,21%,27%,33%{transform:rotate(18deg)}36%,100%{transform:rotate(0)}}
@keyframes arm{0%,6%,12%,18%,24%,30%{transform:rotate(16deg)}3%,9%,15%,21%,27%,33%{transform:rotate(-16deg)}36%,50%,94%,100%{transform:rotate(0)}56%,62%,68%,74%,80%,86%{transform:rotate(-14deg)}59%,65%,71%,77%,83%,89%{transform:rotate(-4deg)}}
@keyframes blink{0%,43%,48%,90%,95%,100%{transform:scaleY(1)}45%,93%{transform:scaleY(.1)}}
@keyframes laptop{0%,47%,100%{opacity:0;transform:translateY(16px)}54%,92%{opacity:1;transform:translateY(0)}98%{opacity:0}}
@keyframes thought{0%,35%,54%,100%{opacity:0}40%,48%{opacity:1}}
@keyframes done{0%,82%,96%,100%{opacity:0}87%,92%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.walk,.laptop{opacity:1;transform:none}.thought,.done{opacity:0}}@keyframes legOther{0%,6%,12%,18%,24%,30%{transform:rotate(18deg)}3%,9%,15%,21%,27%,33%{transform:rotate(-18deg)}36%,100%{transform:rotate(0)}}@keyframes armOther{0%,6%,12%,18%,24%,30%{transform:rotate(-16deg)}3%,9%,15%,21%,27%,33%{transform:rotate(16deg)}36%,50%,94%,100%{transform:rotate(0)}56%,62%,68%,74%,80%,86%{transform:rotate(4deg)}59%,65%,71%,77%,83%,89%{transform:rotate(14deg)}}</style><rect width="640" height="400" rx="24" fill="#131417"/><ellipse cx="320" cy="224" rx="240" ry="170" fill="url(#halo)"/><path d="M92 329H548" stroke="#3a3d43"/><g transform="translate(320 220)"><g class="walk"><ellipse cy="110" rx="82" ry="9" fill="#08090b"/><g class="legA"><path d="M-24 55v43h-18" stroke="#f7f7f5" stroke-width="11" fill="none" stroke-linecap="round"/></g><g class="legB"><path d="M24 55v43h18" stroke="#f7f7f5" stroke-width="11" fill="none" stroke-linecap="round"/></g><g class="body"><g class="armA"><path d="M-51 10q-26 5-17 36" fill="none" stroke="#cda03a" stroke-width="10" stroke-linecap="round"/></g><g class="armB"><path d="M51 10q26 5 17 36" fill="none" stroke="#cda03a" stroke-width="10" stroke-linecap="round"/></g><path d="M0-98 65-61v100L0 77-65 39V-61Z" fill="#202226" stroke="#f7f7f5" stroke-width="3" stroke-linejoin="round"/><path d="M0-98 65-61 0-23-65-61Z" fill="#f7f7f5"/><path d="M0-23v100L65 39V-61Z" fill="#2e3035"/><path d="M0-23v100" stroke="#61656d" stroke-width="2"/><circle cy="-61" r="11" fill="#cda03a"/><g class="eyes" fill="#cda03a"><ellipse cx="-30" cy="3" rx="7" ry="12"/><ellipse cx="26" cy="3" rx="7" ry="12"/></g><path d="M-10 28q10 9 20 0" stroke="#f7f7f5" stroke-width="3" stroke-linecap="round" fill="none"/></g><g class="laptop"><path d="M-63 32H63L53 94H-53Z" fill="#23262c" stroke="#747981" stroke-width="2"/><path d="M-59 35H59" stroke="#f7f7f5" stroke-opacity=".25"/><path d="M-71 95H71L60 102H-60Z" fill="#9ba0a8"/><path d="m-10 62 10-6 10 6v12L0 80-10 74Z" fill="none" stroke="#cda03a" stroke-width="2"/><path d="M-8 97H8" stroke="#131417" stroke-width="2"/></g><g class="thought" fill="#cda03a"><circle cx="78" cy="-78" r="3"/><circle cx="89" cy="-92" r="5"/><path d="M108-131a14 14 0 0 1 9 25v8h-18v-8a14 14 0 0 1 9-25Z" fill="none" stroke="#cda03a" stroke-width="3"/><path d="M102-92h12M108-142v-5M85-128l-5-3M130-128l5-3" stroke="#cda03a" stroke-width="3" stroke-linecap="round"/></g><g class="done"><circle cx="84" cy="-95" r="15" fill="#cda03a"/><path d="m77-95 5 5 9-10" fill="none" stroke="#131417" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>